# ============================================================================
# OnTrak — IT Support Training Platform powered by Innotel OnTrak
#
#   docker compose up -d --build   # everything, including the first run
#   docker compose logs lab-setup  # what that first run did
#   docker compose down
#
# --build is only needed after a pull: without it compose reuses the image from
# the previous commit, and a stale `lab-setup` looks like a broken first run.
#
# One command is the whole installation. `lab-setup` runs first and does what a
# first run needs: it writes `.env` with generated local secrets, publishes the
# shared keys for the two services that must agree on them, and — if the host
# cannot run training machines yet — installs and initialises Incus on the host,
# creating the storage pool, lab bridge, project and profiles. The portal and the
# console gateway start when it finishes (`depends_on: service_completed_
# successfully`), so a machine with only Docker goes from git clone to a running
# lab in one command. `make up` is the same thing with a friendlier summary.
#
# Four containers run the *control plane*:
#
#   lab-setup   first-run setup: secrets, and Incus on the host (then exits)
#   gateway     the origin: one published port, routing / to the portal and
#               /guacamole/ to the console (see deploy/gateway/nginx.conf)
#   portal      the FastAPI student portal: scenarios, tickets, grading, admin
#   guacamole   the HTML5 console (RDP/SSH into the training machines)
#  +guacd       Guacamole's connection daemon, which does the actual protocol work
#
# Only `gateway` publishes a port. The portal and the console are reachable on
# the network but not from the host, so there is one address to put behind TLS
# and no second host port to collide with whatever else the machine runs.
#
# What is deliberately **not** here: the training machines themselves. Those are
# Incus virtual machines on the host — Windows 95 through 11, Server, Office and
# the Linux distributions (see docs/catalog.md) — because a machine that has to
# boot a real Windows kernel, hold a driver fault and survive a malware
# scenario is a VM, not a container. The portal reaches the host's Incus daemon
# through /var/lib/incus, which is why the stack runs from this directory, next
# to the checkout.
#
# No hypervisor on this host (Docker Desktop, or a remote cluster)? Use
# `docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d`, or
# demo mode with ONTRAK_DEMO__ENABLED=true. See docs/docker.md.
# ============================================================================
name: ontrak

services:
  # ── first run: secrets, then the host's hypervisor ────────────────────────
  # This container is a hypervisor admin by design: it installs packages and
  # creates bridges on the host by entering the host's namespaces (pid 1), which
  # is why it asks for `pid: host` and `privileged: true`. It is a one-shot that
  # exits before anything else starts, and it is the only service that writes to
  # the project directory.
  lab-setup:
    # No `build:` here on purpose. This service and `portal` run the same image,
    # and two services building one tag race for it: on a cold build both export
    # at once and one dies with `image "ontrak:local": already exists`, which
    # reads as an image problem and is a compose declaration problem. `portal` is
    # the one service that builds it; this one only uses it.
    image: ${ONTRAK_IMAGE:-ontrak:local}
    container_name: ontrak-lab-setup
    restart: "no"
    entrypoint: ["/app/docker/lab-setup.sh"]
    privileged: true
    pid: host
    environment:
      # auto  = set up the host when it is not ready yet (the default)
      # force = re-run the host bootstrap even if Incus answers
      # off   = secrets only (a remote cluster, or demo mode)
      ONTRAK_LAB_SETUP: ${ONTRAK_LAB_SETUP:-auto}
      ONTRAK_LAB_BOOTSTRAP: ${ONTRAK_LAB_BOOTSTRAP:-infra/bootstrap-host.sh}
      # Storage choices for the host's pool, passed straight to the bootstrap.
      # `dir` works anywhere and copies instead of cloning: fine for a demo,
      # slow for a class. See docs/operations.md.
      ONTRAK_STORAGE_DRIVER: ${ONTRAK_STORAGE_DRIVER:-dir}
      ONTRAK_STORAGE_SOURCE: ${ONTRAK_STORAGE_SOURCE:-}
      ONTRAK_STORAGE_POOL: ${ONTRAK_STORAGE_POOL:-default}
      ONTRAK_NETWORK: ${ONTRAK_NETWORK:-ontrak0}
      ONTRAK_NET_CIDR: ${ONTRAK_NET_CIDR:-10.20.0.1/24}
      ONTRAK_DOMAIN: ${ONTRAK_DOMAIN:-ontrak.lab}
      ONTRAK_INCUS_PROJECT: ${ONTRAK_INCUS__PROJECT:-ontrak}
      ONTRAK_INCUS__REMOTE: ${ONTRAK_INCUS__REMOTE:-local}
      ONTRAK_PORTAL__PORT: ${ONTRAK_PORTAL__PORT:-8080}
      # Read only to report, at the end of a first run, the console address a
      # student's browser will actually be sent to — the portal's own value is
      # below, and a report that printed the local port instead would be wrong
      # on any deployment that puts a TLS console host here.
      ONTRAK_GUAC__BASE_URL: ${ONTRAK_GUAC__BASE_URL:-http://localhost:8080/guacamole/}
      ONTRAK_BIND_ADDR: ${ONTRAK_BIND_ADDR:-127.0.0.1}
      # The checkout, as this container sees it. This is where `.env` is written
      # and where infra/bootstrap-host.sh is read from.
      ONTRAK_PROJECT_DIR: /project
      # The same directory by the path it has on the host, so the bootstrap can
      # be run as the host's own file instead of a staged copy. Empty when the
      # path cannot be known (a remote Docker host): the script then stages the
      # few files it needs into the host's /run and says so.
      ONTRAK_PROJECT_DIR_HOST: ${PWD:-}
      ONTRAK_SECRETS_FILE: /run/ontrak/secrets.env
    volumes:
      # The checkout, twice: at /project for this container's own use, and at
      # the path it has on the host so the bootstrap can be run in place.
      #
      # Deliberately *not* mounted over the image's own /app: a bind mount would
      # shadow the copy baked into the image, including the executable bit the
      # entrypoint needs — and the host's checkout may well be checked out on a
      # filesystem with no exec permission at all. The image's copy of
      # docker/lab-setup.sh is the one that runs.
      - .:/project
      - ${PWD:-.}:${PWD:-/opt/ontrak-host}
      # The generated secrets, read by the portal and the console gateway.
      - ontrak-secrets:/run/ontrak
    networks: [ontrak]

  # ── the student portal ────────────────────────────────────────────────────
  portal:
    # The stack's only builder (see the note on lab-setup). Everything else that
    # runs this image — lab-setup — refers to it by tag.
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ONTRAK_IMAGE:-ontrak:local}
    container_name: ontrak-portal
    restart: unless-stopped
    init: true
    depends_on:
      lab-setup:
        condition: service_completed_successfully
    # Deliberately unpublished: `gateway` holds the only host port, so the portal
    # is reached at / on that one address and never directly. Publishing it too
    # would mean two addresses serving the same app, one of which has no console.
    environment:
      # ── identity and secrets ──
      ONTRAK_PORTAL__TITLE: ${ONTRAK_PORTAL__TITLE:-OnTrak}
      ONTRAK_PORTAL__BRAND_NOTE: ${ONTRAK_PORTAL__BRAND_NOTE:-IT support training range — powered by Innotel OnTrak}
      # Signs the portal's session cookies; without it nobody can log in. Empty
      # on a first run — then the entrypoint reads it from the secrets file that
      # lab-setup wrote, which is what lets `docker compose up` work before .env
      # exists (compose cannot interpolate a secret that is not there yet).
      ONTRAK_PORTAL__SECRET: ${ONTRAK_PORTAL__SECRET:-}
      # ── Cerulean / Authentik sign-in (docs/operations.md "Sign-in") ──
      # The portal is SSO-only and keeps no password: with none of these set it
      # comes up with a login page that says so, and there is no local fallback.
      # `ONTRAK_PORTAL__OIDC_REDIRECT_URI` lists every origin the portal answers
      # on; `ONTRAK_PORTAL__OIDC_CLIENT_SECRET` is a credential — give it to the
      # container like the rest, or as a `vault://` reference the deployment
      # resolves (see .env.example).
      ONTRAK_PORTAL__OIDC_ISSUER: ${ONTRAK_PORTAL__OIDC_ISSUER:-}
      ONTRAK_PORTAL__OIDC_CLIENT_ID: ${ONTRAK_PORTAL__OIDC_CLIENT_ID:-}
      ONTRAK_PORTAL__OIDC_CLIENT_SECRET: ${ONTRAK_PORTAL__OIDC_CLIENT_SECRET:-}
      ONTRAK_PORTAL__OIDC_REDIRECT_URI: ${ONTRAK_PORTAL__OIDC_REDIRECT_URI:-}
      ONTRAK_PORTAL__OIDC_INSTRUCTOR_GROUP: ${ONTRAK_PORTAL__OIDC_INSTRUCTOR_GROUP:-}
      ONTRAK_PORTAL__OIDC_REQUIRED_GROUP: ${ONTRAK_PORTAL__OIDC_REQUIRED_GROUP:-}
      # Must equal JSON_SECRET_KEY below: the portal signs console links with it
      # and Guacamole verifies them. One value, two services.
      ONTRAK_GUAC__SECRET_KEY: ${ONTRAK_GUAC__SECRET_KEY:-}
      ONTRAK_GUAC__BASE_URL: ${ONTRAK_GUAC__BASE_URL:-http://localhost:8080/guacamole/}
      ONTRAK_GUAC__RECORDING: ${ONTRAK_GUAC__RECORDING:-false}
      ONTRAK_GUAC__RECORDING_PATH: /recordings
      # The student's console transport. Fixing this list is what makes the setting
      # in .env actually reach the portal: the console is built from settings inside
      # this container, so a value compose does not forward is a value the range
      # ignores — and the symptom is silent, because a Linux scenario with
      # linux_ssh off renders a page explaining why rather than an error. Turn it on
      # and `ontrak template build` puts sshd in the Linux templates (docs/operations.md,
      # "The student's console: RDP for Windows, SSH for Linux").
      ONTRAK_GUAC__LINUX_SSH: ${ONTRAK_GUAC__LINUX_SSH:-false}
      ONTRAK_GUEST__RDP_PORT: ${ONTRAK_GUEST__RDP_PORT:-3389}
      ONTRAK_SECRETS_FILE: /run/ontrak/secrets.env

      # ── hypervisor ──
      ONTRAK_INCUS__REMOTE: ${ONTRAK_INCUS__REMOTE:-local}
      ONTRAK_INCUS__PROJECT: ${ONTRAK_INCUS__PROJECT:-ontrak}
      ONTRAK_INCUS__STORAGE_POOL: ${ONTRAK_INCUS__STORAGE_POOL:-default}
      ONTRAK_INCUS__NETWORK: ${ONTRAK_INCUS__NETWORK:-ontrak0}
      ONTRAK_INCUS__PROFILE: ${ONTRAK_INCUS__PROFILE:-ontrak-student}
      ONTRAK_INCUS__IMAGE_ALIAS: ${ONTRAK_INCUS__IMAGE_ALIAS:-ontrak-win-base}

      # ── guest automation ──
      # winrm (Windows guests), ssh (Linux guests), incus-exec, or null for a
      # dry run. The driver is chosen per scenario platform when unset.
      ONTRAK_GUEST__DRIVER: ${ONTRAK_GUEST__DRIVER:-}
      ONTRAK_GUEST__USER: ${ONTRAK_GUEST__USER:-student}
      ONTRAK_GUEST__PASSWORD: ${ONTRAK_GUEST__PASSWORD:-}
      ONTRAK_GUEST__STATIC_HOST: ${ONTRAK_GUEST__STATIC_HOST:-}
      # The Linux console's own address and account. `linux_user` is root for the
      # reason on GuestConfig in ontrak/config.py: grading reads /etc/shadow,
      # /etc/sudoers and file ownership, and the machine is disposable.
      ONTRAK_GUEST__SSH_PORT: ${ONTRAK_GUEST__SSH_PORT:-22}
      ONTRAK_GUEST__LINUX_USER: ${ONTRAK_GUEST__LINUX_USER:-root}

      # ── sessions, results and pools ──
      ONTRAK_SESSION__TTL_MINUTES: ${ONTRAK_SESSION__TTL_MINUTES:-90}
      ONTRAK_SESSION__IDLE_RECYCLE_MINUTES: ${ONTRAK_SESSION__IDLE_RECYCLE_MINUTES:-20}
      ONTRAK_SESSION__MAX_PER_STUDENT: ${ONTRAK_SESSION__MAX_PER_STUDENT:-1}
      ONTRAK_SESSION__PERSIST_PROGRESS: ${ONTRAK_SESSION__PERSIST_PROGRESS:-false}
      ONTRAK_POOL__ENABLED: ${ONTRAK_POOL__ENABLED:-true}
      ONTRAK_POOL__DEFAULT_TARGET: ${ONTRAK_POOL__DEFAULT_TARGET:-0}
      ONTRAK_POOL__MAX_TOTAL: ${ONTRAK_POOL__MAX_TOTAL:-60}
      ONTRAK_SELECTION__STRATEGY: ${ONTRAK_SELECTION__STRATEGY:-balanced}

      # ── demo mode (no hypervisor, no Windows, no secrets) ──
      ONTRAK_DEMO__ENABLED: ${ONTRAK_DEMO__ENABLED:-false}
    volumes:
      # Durable portal state: accounts, sessions, submitted results, tickets,
      # audit log. This is the only thing in the stack that matters after a
      # class — the machines are disposable by design.
      - ontrak-state:/app/state
      # Installation media (`ontrak media fetch`): large, so never in the image.
      - ontrak-media:/app/media
      - ./deploy/guacamole/recordings:/recordings
      # The shared secrets lab-setup wrote (used only when the environment has
      # no value for them).
      - ontrak-secrets:/run/ontrak
      # The whole Incus API in one directory: the portal shells out to the
      # `incus` CLI, and `incus.remote: local` is the socket inside it. This is
      # why the container is effectively a hypervisor admin. Mounted as the
      # directory rather than the socket file so a host without Incus yet — or a
      # remote/demo setup — gets an empty directory instead of Docker creating a
      # stray file where the daemon will later want its own socket.
      - /var/lib/incus:/var/lib/incus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks: [ontrak]

  # ── Guacamole: the browser console ────────────────────────────────────────
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: ontrak-guacd
    restart: unless-stopped
    init: true
    volumes:
      - ./deploy/guacamole/recordings:/recordings
    networks: [ontrak]

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: ontrak-guacamole
    restart: unless-stopped
    init: true
    depends_on:
      lab-setup:
        condition: service_completed_successfully
      guacd:
        condition: service_started
    # Reached through `gateway` at /guacamole/, not on a port of its own.
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      # guacamole-auth-json: the portal hands the browser a signed, encrypted,
      # single-use payload scoped to one machine. There is no Guacamole user
      # database and no login page a student ever sees.
      JSON_ENABLED: "true"
      # Empty on a first run; the entrypoint then takes it from the secrets file
      # lab-setup wrote, so both services sign with the same key.
      JSON_SECRET_KEY: ${ONTRAK_GUAC__SECRET_KEY:-}
      LOG_LEVEL: ${ONTRAK_GUAC__LOG_LEVEL:-info}
    volumes:
      - ontrak-secrets:/run/ontrak:ro
    # The stock entrypoint (`/opt/guacamole/bin/entrypoint.sh`, run as the
    # unprivileged `guacamole` user) with one step in front of it: read the
    # shared secrets file when the environment has no key. The image is a
    # Debian/Tomcat stack, so /bin/sh and sed are both there, and lab-setup
    # writes the file readable for exactly this reason.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "${JSON_SECRET_KEY:-}" ] && [ -r /run/ontrak/secrets.env ]; then
          JSON_SECRET_KEY="$(sed -n 's/^ONTRAK_GUAC__SECRET_KEY=//p' /run/ontrak/secrets.env)"
          export JSON_SECRET_KEY
        fi
        if [ -z "${JSON_SECRET_KEY:-}" ]; then
          echo "ontrak: no console key — the portal cannot hand out console links" >&2
        fi
        exec /opt/guacamole/bin/entrypoint.sh "$@"
      - --
    healthcheck:
      # The image is a Tomcat deployment; probe whichever HTTP client it has.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/guacamole/ >/dev/null 2>&1 || wget -q --spider http://127.0.0.1:8080/guacamole/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks: [ontrak]

  # ── the origin ────────────────────────────────────────────────────────────
  # The estate's edge forwards a host, not a path, so the portal and the console
  # share this one address: `/` to the portal, `/guacamole/` (websocket included)
  # to the console. It holds the stack's only published port.
  #
  # This is where the stack's posture meets the network: loopback by default, so
  # a TLS proxy goes in front of it and nothing is served in the clear off-host.
  # Set ONTRAK_BIND_ADDR=0.0.0.0 in .env for a lab where students reach this host
  # directly — and then make ONTRAK_GUAC__BASE_URL the URL their browsers use.
  gateway:
    image: ${ONTRAK_GATEWAY_IMAGE:-nginx:1.27-alpine}
    container_name: ontrak-gateway
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_started
      guacamole:
        condition: service_started
    ports:
      - "${ONTRAK_BIND_ADDR:-127.0.0.1}:${ONTRAK_PORTAL__PORT:-8080}:8080"
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [ontrak]

volumes:
  ontrak-state:
    name: ontrak-state
  ontrak-media:
    name: ontrak-media
  # The shared secrets, written once by lab-setup and read by the portal and the
  # console gateway. Kept out of the project directory so a first run works
  # without a writable checkout, and out of the image so it never ships.
  ontrak-secrets:
    name: ontrak-secrets

networks:
  # A private bridge. The portal needs no egress of its own — it reaches the
  # training machines through the host's Incus socket — and the console is only
  # ever spoken to by the origin gateway on this network.
  ontrak:
    name: ontrak
