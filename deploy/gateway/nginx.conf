# OnTrak's origin: one port, two upstreams.
#
# The estate's edge (NPM) forwards a *host*, not a path — so the portal and the
# HTML5 console have to answer on one port for a student's browser to reach both
# at https://<range>/ and https://<range>/guacamole/. This file is that origin:
# the only service in the stack that publishes a port, and the only place a path
# is routed.
#
#   /            -> portal      the FastAPI app: scenarios, tickets, grading, admin
#   /guacamole/  -> guacamole   the console, including its websocket tunnel
#
# One published port is also the point: an arrangement that gave the console a
# port of its own needed a second host port (8081), which is exactly the port a
# development host tends to be using for something else.
#
# `map` is legal here because nginx includes this directory inside `http {}`.

# Upgrade the connection when the client asked to, and leave it alone when it did
# not. Guacamole falls back to HTTP polling without this, which works and is a
# poor classroom experience.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # A ticket can carry a screenshot and a scenario can carry a script. Larger
    # than an upload should ever be, smaller than "the proxy is the disk quota".
    client_max_body_size 64m;

    proxy_http_version 1.1;
    # $http_host, not $host: $host drops the port. The portal chooses its OIDC
    # callback by matching the origin the sign-in started on against the URLs
    # registered with Authentik, and those carry the port — so with the port
    # dropped nothing ever matches, every sign-in silently falls back to the
    # canonical (first) entry, and a range that answers on several origins can
    # only be signed into on that first one. See ontrak/oidc.py `callback_for`
    # and docs/operations.md "Sign-in".
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # A student's screen can sit unchanged for minutes. The 60s default would cut
    # them off mid-scenario, which reads to them as the range breaking.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /guacamole/ {
        # The path is passed through unchanged: the webapp is deployed at
        # /guacamole/ inside its container and generates base-relative URLs from
        # there. Rewriting it would break every one of them.
        proxy_pass http://guacamole:8080;

        # The tunnel is a stream of screen updates. Buffering it adds latency to
        # every keystroke and every repaint.
        proxy_buffering off;
        # Let the upstream decide when the tunnel ends, not a client that walked
        # away from a laptop.
        proxy_ignore_client_abort on;
    }

    location / {
        proxy_pass http://portal:8080;
    }
}
